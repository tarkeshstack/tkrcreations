<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKR Creations - My Work</title>
<style>
  :root { --bg:#f4f5f8; --card:#fff; --ink:#18223a; --mute:#5d6a85; --line:#dde2ec; --brand:#1F6FEB; --bar:#18223a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1524; --card:#18223a; --ink:#e8edf8; --mute:#9aa8c7; --line:#2a3a5c; --brand:#5b9bff; --bar:#0a1020; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI", Calibri, Arial, sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:48px 20px 60px; }
  h1 { margin:0; font-size:clamp(30px, 6vw, 44px); letter-spacing:-.02em; }
  h1 span { color:var(--brand); }
  .tag { margin:10px 0 0; color:var(--mute); font-size:17px; max-width:560px; line-height:1.5; }
  h2 { margin:44px 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .work { display:flex; flex-direction:column; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; text-decoration:none; color:inherit; transition:transform .15s, box-shadow .15s, border-color .15s; cursor:pointer; text-align:left; font:inherit; }
  .work:hover, .work:focus-visible { transform:translateY(-2px); border-color:var(--brand); box-shadow:0 8px 22px rgba(24,34,58,.12); outline:none; }
  .ico { width:44px; height:44px; border-radius:11px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:22px; }
  .work h3 { margin:4px 0 0; font-size:19px; }
  .work p { margin:0; color:var(--mute); line-height:1.45; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:6px; }
  .chips i { font-style:normal; font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--mute); }
  .open { margin-top:6px; color:var(--brand); font-weight:600; font-size:15px; }
  footer { margin-top:56px; color:var(--mute); font-size:13px; }

  /* app view */
  #appbar { position:fixed; left:0; right:0; top:0; height:44px; z-index:50; background:var(--bar); color:#fff; display:none; align-items:center; gap:12px; padding:0 10px; font-size:15px; }
  #appbar button { border:0; background:rgba(255,255,255,.14); color:#fff; border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  #appbar b { font-weight:600; }
  #frame { position:fixed; left:0; right:0; top:44px; bottom:0; width:100%; height:calc(100% - 44px); border:0; background:#e6e8eb; visibility:hidden; pointer-events:none; }
  body.app { overflow:hidden; }
  body.app #appbar { display:flex; }
  body.app #frame { visibility:visible; pointer-events:auto; }
  body.app .wrap { display:none; }
</style>
</head>

<script>
(function () {
  // Add new works here. Each one is an app stored inside this same file.
  var WORKS = [
    { id: "resume", icon: "📄", title: "Resume Editor",
      desc: "Edit your resume section by section, read it page by page, and download it as PDF or Word.",
      chips: ["PDF", "Word", "Works offline", "Mobile friendly"], src: "app-resume-b64" }
  ];

  var grid = document.getElementById("grid"), frame = document.getElementById("frame"), loaded = "";
  grid.innerHTML = WORKS.map(function (w) {
    return '<a class="work" href="#/' + w.id + '"><div class="ico">' + w.icon + "</div><h3>" + w.title + "</h3><p>" + w.desc + "</p>" +
      '<div class="chips">' + w.chips.map(function (c) { return "<i>" + c + "</i>"; }).join("") + '</div><div class="open">Open →</div></a>';
  }).join("");

  function decode(id) {
    var bin = atob(document.getElementById(id).textContent.trim()), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(a);
  }
  function route() {
    var id = (location.hash.match(/^#\/(\w+)/) || [])[1], w = WORKS.filter(function (x) { return x.id === id; })[0];
    if (!w) { document.body.classList.remove("app"); document.title = "TKR Creations - My Work"; return; }
    if (loaded !== w.id) {
      frame.srcdoc = decode(w.src).replace("<head>", "<head><script>window.__HUB__=1<\/script>");
      loaded = w.id;
    }
    document.getElementById("apptitle").textContent = w.title;
    document.title = w.title + " - TKR Creations";
    document.body.classList.add("app");
  }
  document.getElementById("back").onclick = function () { location.hash = ""; };
  window.addEventListener("hashchange", route);
  route();
})();
</script>
